<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSUK Dashboard Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#16261C; --forest-deep:#1F3D28; --forest:#2B5336;
    --sage-pale:#8fae86; --honey:#C08B41; --honey-l:#D6A868;
    --hero:url('https://assets.cdn.filesafe.space/J378Bt0d7JvG2rXks3zo/media/6ac4da2cc062e4fb051fb066.png');
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--ground);}
  body{font-family:'Poppins',Arial,Helvetica,sans-serif;color:#ffffff;-webkit-font-smoothing:antialiased;overflow:hidden;}

  .banner{position:relative;height:100%;min-height:56px;display:flex;align-items:center;
    background-image:var(--hero);background-size:cover;background-position:center 60%;}
  .banner::before{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(22,38,28,0.86) 0%,rgba(31,61,40,0.62) 45%,rgba(31,61,40,0.25) 80%,rgba(31,61,40,0.10) 100%);}

  .inner{position:relative;z-index:2;width:100%;padding:0 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}

  .kicker{font-size:10px;font-weight:700;letter-spacing:0.32em;text-transform:uppercase;color:var(--honey-l);white-space:nowrap;}
  h1{font-size:20px;font-weight:700;line-height:1;letter-spacing:-0.2px;color:#ffffff;white-space:nowrap;}
  h1 span{color:var(--honey-l);}
  .date{font-size:13px;font-weight:400;color:#e9eee4;white-space:nowrap;}
  .date .wd{font-weight:700;color:#ffffff;}

  .clock{display:inline-flex;align-items:center;gap:10px;margin-left:auto;background:rgba(22,38,28,0.45);
    border:1px solid rgba(255,255,255,0.18);border-radius:40px;padding:5px 14px;backdrop-filter:blur(4px);white-space:nowrap;}
  .clock .lab{font-size:9px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:#e9eee4;}
  .clock .t{font-size:14px;font-weight:700;color:#ffffff;line-height:1;}
  .clock .s{font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;}
  .open{color:var(--honey-l);}
  .shut{color:var(--sage-pale);}

  @media(max-width:820px){
    .inner{padding:8px 16px;gap:6px 14px;}
    .kicker{display:none;}
    h1{font-size:17px;}
    .date{font-size:12px;}
    .clock{margin-left:0;}
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="inner">
      <div class="kicker">Barrel Sauna UK</div>
      <h1>Good morning, <span>team</span></h1>
      <div class="date"><span class="wd" id="wd">&nbsp;</span> <span id="dm"></span></div>
      <div class="clock">
        <span class="lab">Workshop</span>
        <span class="t" id="t">--:--</span>
        <span class="s" id="s"></span>
      </div>
    </div>
  </div>
<script>
  // Workshop time is UK time. Open 9am to 6pm, Monday to Friday.
  function tick(){
    var now = new Date();
    var tz = 'Europe/London';
    var parts = new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now);
    var p = {};
    parts.forEach(function(x){ p[x.type] = x.value; });
    var hour = parseInt(p.hour,10) % 24;
    var weekend = (p.weekday === 'Saturday' || p.weekday === 'Sunday');
    var open = !weekend && hour >= 9 && hour < 18;
    document.getElementById('wd').textContent = p.weekday;
    document.getElementById('dm').textContent = p.day + ' ' + p.month + ' ' + p.year;
    document.getElementById('t').textContent = (hour < 10 ? '0' : '') + hour + ':' + p.minute;
    var s = document.getElementById('s');
    s.textContent = open ? 'Open' : 'Closed';
    s.className = 's ' + (open ? 'open' : 'shut');
  }
  tick();
  setInterval(tick, 30000);
</script>
</body>
</html>
