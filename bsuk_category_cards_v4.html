<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16261C;--deep:#1F3D28;--forest:#2B5336;--sage:#50795F;--pale:#8fae86;--tint:#eef4ef;--line:#e3e8e4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:Poppins,Arial,sans-serif;color:var(--ink)}
.sec{padding:56px 16px}
.wrap{max-width:1100px;margin:0 auto}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
img{display:block;max-width:100%;height:auto}

/* D list on the left, big product on the right */
.d{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center}
.d-list{display:flex;flex-direction:column}
.d-item{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;padding:20px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:#9aa69e;transition:color .3s,padding .3s}
.d-item:first-child{border-top:1px solid var(--line)}
.d-n{font-weight:300;font-size:13px;letter-spacing:.2em}
.d-name{font-weight:600;font-size:26px;letter-spacing:-.3px}
.d-item i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(-8px);transition:all .3s}
.d-item.on{color:var(--ink);padding-left:14px}
.d-item.on i{opacity:1;transform:none;background:var(--deep);border-color:var(--deep);color:#fff}
.d-stage{position:relative;height:380px;border-radius:28px;background:radial-gradient(70% 70% at 50% 50%,#2B5336 0%,#1F3D28 60%,#16261C 100%);overflow:hidden}
.d-shot{position:absolute;inset:0;margin:auto;max-width:78%;max-height:70%;object-fit:contain;opacity:0;transform:scale(.92) translateY(10px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 20px 26px rgba(0,0,0,.45))}
.d-shot.on{opacity:1;transform:none}

@media (max-width:820px){
 .sec{padding:36px 12px}
 .d{grid-template-columns:1fr;gap:18px} .d-stage{height:230px;order:-1;border-radius:20px} .d-name{font-size:18px} .d-item{padding:14px 4px;grid-template-columns:36px 1fr 30px} .d-item i{width:30px;height:30px}
}
</style>
</head>
<body>
<section class="sec"><div class="wrap d">
 <div class="d-list">
  <a class="d-item on" href="https://www.barrelsaunauk.com/our-mobile-sauna-builds" target="_top" data-k="0"><span class="d-n">01</span><span class="d-name">Mobile Saunas</span><i><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>
  <a class="d-item" href="https://www.barrelsaunauk.com/prepare-your-space" target="_top" data-k="1"><span class="d-n">02</span><span class="d-name">Residential Install</span><i><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>
  <a class="d-item" href="https://www.barrelsaunauk.com/book-a-call-back" target="_top" data-k="2"><span class="d-n">03</span><span class="d-name">Commercial Retreats</span><i><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>
  <a class="d-item" href="https://www.barrelsaunauk.com/book-a-call-back" target="_top" data-k="3"><span class="d-n">04</span><span class="d-name">Bespoke Designs</span><i><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></a>
 </div>
 <div class="d-stage">
  <img class="d-shot on" data-k="0" src="https://static.wixstatic.com/media/c71fcd_5684393b570f4e3c9df2317f494c7d1c~mv2.png" alt="Mobile Saunas">
  <img class="d-shot" data-k="1" src="https://static.wixstatic.com/media/c71fcd_36ddd5fcff96481597fa2eef2185e386~mv2.png" alt="Residential Install">
  <img class="d-shot" data-k="2" src="https://static.wixstatic.com/media/c71fcd_e7c6545ad6214697ba71b32c0fd573a3~mv2.png" alt="Commercial Retreats">
  <img class="d-shot" data-k="3" src="https://static.wixstatic.com/media/c71fcd_15b7593816534f2ab2370697161af51d~mv2.png" alt="Bespoke Designs">
 </div>
</div></section>
<script>
(function(){
 var items=[].slice.call(document.querySelectorAll('.d-item')),shots=[].slice.call(document.querySelectorAll('.d-shot'));
 function pick(k){items.forEach(function(x){x.classList.toggle('on',x.dataset.k==k)});shots.forEach(function(x){x.classList.toggle('on',x.dataset.k==k)});}
 items.forEach(function(it){it.addEventListener('mouseenter',function(){pick(it.dataset.k)});it.addEventListener('focus',function(){pick(it.dataset.k)});});
 var i=0,auto=setInterval(function(){i=(i+1)%items.length;pick(i)},3200);
 document.querySelector('.d').addEventListener('mouseenter',function(){clearInterval(auto)});
})();
</script>
</body>
</html>
