<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expo Email 1 Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--forest:#2B5336;--line:#dfe3df}
*{box-sizing:border-box}
body{margin:0;background:#ffffff;font-family:Poppins,Arial,sans-serif;color:#1d2a22}
.bar{position:sticky;top:0;z-index:5;background:#16261C;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .t{font-size:14px}
.bar .t span{color:rgba(255,255,255,.7);font-size:12px;display:block}
.sw{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.sw button{font-family:inherit;font-size:13px;background:transparent;color:#fff;border:0;padding:7px 16px;cursor:pointer}
.sw button.on{background:#fff;color:#16261C}
.stage{padding:24px 16px 48px;display:flex;justify-content:center}
.frame{width:100%;max-width:700px;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:max-width .25s}
.frame.phone{max-width:390px}
iframe{display:block;width:100%;border:0;height:2200px}
</style>
</head>
<body>
<div class="bar">
<div class="t">Expo email 1, both tracks, v2<span>Subject: Lovely to meet you at the NEC</span></div>
<div class="sw"><button class="on" id="bd">Desktop</button><button id="bp">Phone</button></div>
</div>
<div class="stage"><div class="frame" id="fr"><iframe id="em" title="Email preview"></iframe></div></div>

<template id="mail">

<script>
var f=document.getElementById('em'),fr=document.getElementById('fr');
f.srcdoc=document.getElementById('mail').innerHTML;
f.onload=function(){try{f.style.height=f.contentDocument.body.scrollHeight+40+'px'}catch(e){}};
function set(p){fr.classList.toggle('phone',p);document.getElementById('bp').classList.toggle('on',p);document.getElementById('bd').classList.toggle('on',!p);setTimeout(f.onload,300)}
document.getElementById('bd').onclick=function(){set(false)};
document.getElementById('bp').onclick=function(){set(true)};
</script>
