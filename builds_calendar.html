<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --panel:#eef4ef;
  --ink:#16261C;
  --muted:#50795F;
  --line:#dbe7dd;
  --forest-deep:#1F3D28;
  --honey:#C08B41;
  --honey-light:#D6A868;
  --shadow:0 1px 2px rgba(22,38,28,.06),0 6px 18px rgba(22,38,28,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins",Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{padding:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kicker{font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--honey)}
h1{margin:2px 0 0;font-size:21px;font-weight:700;line-height:1.2;color:var(--forest-deep)}
h1 span{color:var(--honey)}

/* bar chart, lifted from the content plan Builds tab (v13) */
.bl-legend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:26px 0 12px;font-size:13.5px;color:var(--muted)}
.bl-legend span{display:inline-flex;align-items:center;gap:6px}
.bl-legend i{display:inline-block;width:22px;height:12px;border-radius:4px}
.bl-legend i.due{background:var(--honey)}
.bl-legend i.open{background:var(--forest-deep)}
.bl-legend i.hold{background:repeating-linear-gradient(135deg,#8fae86 0 4px,#dbe7dd 4px 8px)}
.bl-legend i.mark{width:4px;height:18px;border-radius:0;background:#fff;outline:1px solid var(--muted)}
.bl-legend i.today{width:3px;height:18px;border-radius:0;background:#C08B41}
.bl-status{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:1.4em}
.bl-wrap{margin-top:18px;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.bl-grid{min-width:900px;position:relative}
.bl-months{display:grid;grid-template-columns:230px 1fr;border-bottom:2px solid var(--line)}
.bl-months .lab{padding:14px 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bl-months .mo{position:relative;height:46px}
.bl-months .mo > span{position:absolute;top:6px;height:18px;line-height:18px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest-deep);font-weight:700;border-left:1px solid var(--line);padding-left:8px;white-space:nowrap}
.bl-row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--line);min-height:66px}
.bl-row:last-child{border-bottom:0}
.bl-row .who{padding:12px 16px;font-size:15.5px;line-height:1.3;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bl-row .who .nm{font-weight:700;color:var(--ink)}
.bl-row .who .sub{font-size:12.5px;color:var(--muted)}
.bl-row .track{position:relative}
.bl-row .track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--wk) - 1px),var(--line) calc(var(--wk) - 1px),var(--line) var(--wk));opacity:.55;pointer-events:none}
.bl-bar{position:absolute;top:18px;height:30px;border-radius:999px;background:var(--forest-deep);color:#fff;font-size:12.5px;line-height:30px;font-weight:700;white-space:nowrap;padding:0 12px;overflow:visible;box-shadow:var(--shadow)}
.bl-bar.due{background:var(--honey)}
.bl-bar.hold{background:repeating-linear-gradient(135deg,#8fae86 0 4px,#dbe7dd 4px 8px);color:var(--ink)}
.bl-bar .d{position:absolute;right:-8px;top:50%;transform:translate(100%,-50%);color:var(--ink);font-weight:700;font-size:12.5px}
.bl-bar.due .d{color:var(--honey)}
.bl-mk{position:absolute;top:14px;width:4px;height:38px;background:#fff;outline:1px solid var(--muted);border-radius:2px;z-index:2}
.bl-eta{position:absolute;top:50px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid var(--honey);transform:translateX(-9px);z-index:3}
.bl-today{position:absolute;top:0;bottom:0;width:3px;background:#C08B41;z-index:4;opacity:.9}
.bl-today span{position:absolute;top:18px;left:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#C08B41;font-weight:700;white-space:nowrap;line-height:16px}
.bl-months .mo .bl-today{top:0;bottom:0}
.bl-months .mo .bl-today span{top:26px;height:16px;border:0;padding:0}
.bl-legend{margin:14px 0 0}
.bl-wrap{margin-top:12px}
.bl-row .who{cursor:pointer}
.bl-row .who:hover .nm,.bl-row .who:focus .nm{color:var(--honey)}
.bl-row .who:focus{outline:none}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.bl-status{margin:0;min-height:0;font-size:11.5px}

/* detail card */
.pop{position:fixed;inset:0;background:rgba(22,38,28,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.pop.on{display:flex}
.card{background:#ffffff;border:1px solid var(--line);border-radius:14px;max-width:400px;width:100%;padding:16px 18px;box-shadow:0 10px 30px rgba(22,38,28,.18)}
.card .k{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--honey)}
.card h3{margin:2px 0 8px;font-size:17px;font-weight:700;line-height:1.3;color:var(--forest-deep)}
.card dl{display:grid;grid-template-columns:100px 1fr;gap:5px 10px;margin:0 0 14px;font-size:12.5px;line-height:1.45}
.card dt{color:var(--muted);font-weight:600}
.card dd{margin:0}
.card .acts{display:flex;gap:8px;justify-content:flex-end}
.card .acts a,.card .acts button{font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none}
.card .acts a{background:var(--honey);color:#ffffff;border:0}
.card .acts button{background:#ffffff;color:var(--forest-deep);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <div class="kicker">Builds</div>
      <h1>Who should be <span>ready</span> when</h1>
    </div>
  </div>

  <div class="bl-legend">
    <span><i class="open"></i> on the 10 week clock</span>
    <span><i class="due"></i> week 10 has passed, should be ready</span>
    <span><i class="hold"></i> on hold (grant or invoice)</span>
    <span><i class="mark"></i> week 6 and week 9 touchpoints</span>
    <span><i class="today"></i> today</span>
    <span>&#9650; Marta's ETA</span>
  </div>

  <div class="bl-wrap"><div class="bl-grid" id="bl-grid"></div></div>

  <div class="foot">
    <p class="bl-status" id="bl-status">Loading from the sheet.</p>
    <span>10 week model from the deposit date · v2</span>
  </div>
</div>

<div class="pop" id="pop" role="dialog" aria-modal="true">
  <div class="card">
    <div class="k" id="p-k">Build</div>
    <h3 id="p-nm"></h3>
    <dl id="p-dl"></dl>
    <div class="acts">
      <button type="button" id="p-close">Close</button>
      <a id="p-open" href="#" target="_blank" rel="noopener">Open in GHL</a>
    </div>
  </div>
</div>

<script>
(function(){
  /* Read only. Same Apps Script web app the content plan uses; this page never writes to the sheet. */
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbzrcP-9iZ6570sK6sXnc6xHwi1i6MuUDUe4GzZbC4huiDt00NiRx2BaTgH_cy6jaCPr/exec";
  var GHL_CONTACT = "https://app.gohighlevel.com/v2/location/J378Bt0d7JvG2rXks3zo/contacts/detail/";
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var byId = {};

  /* Fallback rows if the sheet cannot be reached: the deposits paid up to 2 October 2026, same as the content plan. */
  var BUILDS_SEED = [
    { key: 'jvYksiWM2xlScnvOFUJg', name: 'John Williams', where: 'Pitchside Sauna', product: 'Not recorded in GHL', deposit_date: '2026-06-30', actual_eta: '', status: 'deposit paid', distance: 'unknown', note: 'Date from the deposit email, paid before the payment link existed', deal_id: 'jvYksiWM2xlScnvOFUJg', contact_id: 'k5R7OiWUyCosO2el5jrJ' },
    { key: 'VKpYygCzR0OTrecDW01u', name: 'Tanya Aplin', where: '', product: '2.5m barrel sauna, porch, half glass, electric wifi heater, build on site', deposit_date: '2026-07-01', actual_eta: 'Mid to end October (Marta, 24 Sep)', status: 'deposit paid', distance: 'unknown', note: 'Base ready by about 3 Oct', deal_id: 'VKpYygCzR0OTrecDW01u', contact_id: 'TldeLOrH7qSv4Aw6g55p' },
    { key: '1Ix2WJeKIeW7pWFu7plV', name: 'Fairview Apiary (Rod)', where: '', product: 'Not recorded in GHL', deposit_date: '2026-08-03', actual_eta: '', status: 'paid in full', distance: 'unknown', note: 'Full balance by bank transfer 3 Aug, deposit date before that not recorded', deal_id: '1Ix2WJeKIeW7pWFu7plV', contact_id: 'nYKipjdDFFGBhU4nYXM7' },
    { key: 'jzaPj77DXEMEyF7esmQt', name: 'Stefano Capaldo', where: 'Lochgoilhead, Scotland', product: 'Sauna with custom window layout plus 8 seater square hot tub', deposit_date: '2026-08-03', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'jzaPj77DXEMEyF7esmQt', contact_id: '27wwOIHi2eBSNqU6FvMz' },
    { key: 'zWp8NybXHhnyeYrYPCp2', name: 'Neil Savage (Breeze Gym)', where: 'Folkestone', product: 'Not recorded in GHL', deposit_date: '2026-08-18', actual_eta: '', status: 'deposit paid', distance: 'far', note: 'Content missed, named on the 29 Sep call', deal_id: 'zWp8NybXHhnyeYrYPCp2', contact_id: 'ByvUxdR18vS8n6e5qzfh' },
    { key: 'aSrLZujHcJb209qmMCy0', name: 'Joe Lewis (Reload Recovery)', where: 'Ammanford', product: 'Not recorded in GHL', deposit_date: '2026-08-24', actual_eta: '', status: 'deposit paid', distance: 'mid', note: '', deal_id: 'aSrLZujHcJb209qmMCy0', contact_id: 'bETYDtRVfm63cz7bW2QG' },
    { key: 'WnEhPoo4WAT2MHBvSQF4', name: 'Mark Appleton', where: 'Princes Risborough', product: '2m compact barrel sauna, 1.8m plus porch, 9kW Harvia heater', deposit_date: '2026-08-24', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'WnEhPoo4WAT2MHBvSQF4', contact_id: 'amYNq4gz8G8pGK1XoyXH' },
    { key: 'g0wzWJuixPp0WpIKbRmo', name: 'Peter Ward', where: 'Camberley', product: '3m barrel sauna, porch, blackout globe, electric wifi heater, decking base', deposit_date: '2026-08-25', actual_eta: 'October, on site build', status: 'deposit paid', distance: 'far', note: 'Wants proper notice of the date', deal_id: 'g0wzWJuixPp0WpIKbRmo', contact_id: 'Qy3D4Gu6amHWhkZsoAXZ' },
    { key: 'qVXhaKbuuorfI7bAJAPz', name: 'Nikki Burnett', where: 'Ynysddu', product: '4m x 2.3m barrel sauna with changing room and wood burner, plus 6 person ice bath', deposit_date: '2026-08-27', actual_eta: '', status: 'deposit paid', distance: 'local', note: 'Sauna and ice bath in one garden', deal_id: 'qVXhaKbuuorfI7bAJAPz', contact_id: 'CF7190OHUJsaWQPHm9jT' },
    { key: 'a4TxzaiJVOvb9vW9b2We', name: 'Carla McHugh', where: 'Llanidloes', product: 'Not recorded in GHL', deposit_date: '2026-08-31', actual_eta: '', status: 'deposit paid', distance: 'mid', note: '', deal_id: 'a4TxzaiJVOvb9vW9b2We', contact_id: 'ZBxuTMMnAJjHbruITxag' },
    { key: 'nFInhIn69Vy6056eTkAu', name: 'Patrick Coyle', where: 'Cardiff', product: 'Two person barrel sauna and outdoor shower on a 3m x 3m plinth', deposit_date: '2026-09-09', actual_eta: '', status: 'paid in full', distance: 'local', note: 'Ready at his end, 30 Sep', deal_id: 'nFInhIn69Vy6056eTkAu', contact_id: 'Gv9B1TgerHEiBw8Wknwy' },
    { key: 'OOHJdw7o492Yyfsqz9Qs', name: 'Cwmdu Campsite (Sarah Farr, Calvin Clark)', where: 'Crickhowell', product: '4m mobile barrel sauna on a trailer plus two commercial ice baths', deposit_date: '2026-09-16', actual_eta: '', status: 'awaiting grant', distance: 'local', note: 'Grant decision early October, invoice unpaid', deal_id: 'OOHJdw7o492Yyfsqz9Qs', contact_id: 'pLCTIyQE9SsSkYe4GcXw' },
    { key: 'kmpkX9nn3Lqr8m8f6lDn', name: 'James McCarthy', where: 'Bartley, New Forest', product: '3.4m x 2.3m sauna with 1m changing room', deposit_date: '2026-09-17', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'kmpkX9nn3Lqr8m8f6lDn', contact_id: 'g46WL3KgIijoFXeuHpHa' },
    { key: 'HCmnW1MIhKyTLZl911NJ', name: 'Verity Johnson', where: 'Brockenhurst', product: 'Not recorded in GHL', deposit_date: '2026-09-18', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'HCmnW1MIhKyTLZl911NJ', contact_id: 'oUlaxQ5L8Q7poRZVuRYO' },
    { key: 'mwTrpXxtL5VracKVMWXq', name: 'Eleanor Matthews', where: 'Woodstock, Oxfordshire', product: 'Compact barrel sauna 1.8m x 2m, on site build, ice bath discussed', deposit_date: '2026-09-23', actual_eta: '', status: 'deposit paid', distance: 'far', note: 'Video review owed', deal_id: 'mwTrpXxtL5VracKVMWXq', contact_id: 'kPXojAbWmAJHBP3c8WAB' },
    { key: 'F6RisnNpYYma9SAbXYai', name: 'Paul Averley', where: 'Newcastle upon Tyne', product: '2.7m barrel sauna, wood burning, tint globe, flush full glass', deposit_date: '2026-09-25', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'F6RisnNpYYma9SAbXYai', contact_id: 'e3eBiic1e2VP7814sNEr' },
    { key: 'jkic6D40Dkn359bEMj4L', name: 'Christopher Longcroft', where: 'Danehill, Sussex', product: '3.2m x 2.3m barrel sauna, porch, Harvia Cilindro wifi heater', deposit_date: '2026-09-30', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'jkic6D40Dkn359bEMj4L', contact_id: 'AguDiMkkOPQWLnSY9j5b' }
  ];

  var DAY_MS = 86400000;
  function isoToDate(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
  function addDays(d, n){ return new Date(d.getTime() + n * DAY_MS); }
  function fmtShort(d){ return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : ''; }
  function fmtLong(d){ return d ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : ''; }
  function todayUTC(){ var n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); }
  function normBuild(b){
    var dep = isoToDate(b.deposit_date);
    var o = {};
    Object.keys(b).forEach(function(k){ o[k] = b[k] == null ? '' : String(b[k]); });
    o.dep = dep;
    o.w6 = dep ? addDays(dep, 42) : null;
    o.w9 = dep ? addDays(dep, 63) : null;
    o.w10 = dep ? addDays(dep, 70) : null;
    o.etaDate = isoToDate(o.actual_eta);
    var st = (o.status || '').toLowerCase();
    o.hold = /grant|hold|unpaid|invoice/.test(st);
    o.full = /full/.test(st);
    return o;
  }
  function renderBuilds(rows, sourceText){
    var grid = document.getElementById('bl-grid');
    
    var st = document.getElementById('bl-status');
    if (!grid) return;
    var list = rows.map(normBuild).filter(function(r){ return r.dep; }).sort(function(a,b){ return a.dep - b.dep; });
    if (!list.length) { grid.innerHTML = ''; if (st) st.textContent = sourceText || ''; return; }
    byId = {}; list.forEach(function(r){ byId[r.key || r.deal_id || r.name] = r; });
    var today = todayUTC();
    /* range: Monday of the first deposit week to the Sunday after the last week 10, at least to the end of this year */
    var first = list[0].dep; var dow = (first.getUTCDay() + 6) % 7; var start = addDays(first, -dow);
    var last = list.reduce(function(m, r){ var e = r.etaDate && r.etaDate > r.w10 ? r.etaDate : r.w10; return e > m ? e : m; }, list[0].w10);
    var yearEnd = new Date(Date.UTC(today.getUTCFullYear(), 11, 31));
    if (yearEnd > last) last = yearEnd;
    if (today > last) last = today;
    last = addDays(last, 14);
    var span = last - start;
    function pct(d){ return Math.max(0, Math.min(100, (d - start) / span * 100)); }
    var weeks = Math.round(span / (7 * DAY_MS));
    var wk = (100 / weeks) + '%';
    /* months */
    var months = '';
    var m = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1));
    while (m <= last) {
      if (m >= start) months += '<span style="left:' + pct(m).toFixed(2) + '%">' + m.toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' }) + (m.getUTCMonth() === 0 ? ' ' + m.getUTCFullYear() : '') + '</span>';
      m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1));
    }
    var todayLeft = pct(today).toFixed(2) + '%';
    var h = '<div class="bl-months"><div class="lab">' + list.length + (list.length === 1 ? ' build' : ' builds') + '</div><div class="mo">' + months + '<div class="bl-today" style="left:' + todayLeft + '"><span>today ' + esc(fmtShort(today)) + '</span></div></div></div>';
    list.forEach(function(r){
      var due = r.w10 <= today && !r.hold;
      var cls = 'bl-bar' + (r.hold ? ' hold' : due ? ' due' : '');
      var l = pct(r.dep), w = pct(r.w10) - l;
      var label = r.hold ? 'on hold' : due ? 'should be ready' : 'week 10: ' + fmtShort(r.w10);
      h += '<div class="bl-row"><div class="who" data-id="' + esc(r.key || r.deal_id || r.name) + '" role="button" tabindex="0"><span class="nm">' + esc(r.name) + '</span>' + (r.where ? '<span class="sub">' + esc(r.where) + '</span>' : '') + '</div><div class="track" style="--wk:' + wk + '">';
      h += '<div class="' + cls + '" style="left:' + l.toFixed(2) + '%;width:' + Math.max(w, 2).toFixed(2) + '%" title="Deposit ' + esc(fmtLong(r.dep)) + ', week 10 ' + esc(fmtLong(r.w10)) + '">' + (w > 12 ? esc(fmtShort(r.dep)) : '') + '<span class="d">' + esc(label) + '</span></div>';
      h += '<div class="bl-mk" style="left:' + pct(r.w6).toFixed(2) + '%" title="Week 6 production update ' + esc(fmtLong(r.w6)) + '"></div>';
      h += '<div class="bl-mk" style="left:' + pct(r.w9).toFixed(2) + '%" title="Week 9 pre install check ' + esc(fmtLong(r.w9)) + '"></div>';
      if (r.etaDate) h += '<div class="bl-eta" style="left:' + pct(r.etaDate).toFixed(2) + '%" title="ETA ' + esc(fmtLong(r.etaDate)) + '"></div>';
      h += '<div class="bl-today" style="left:' + todayLeft + '"></div>';
      h += '</div></div>';
    });
    grid.innerHTML = h;
    if (st) st.textContent = sourceText || '';
  }
  /* detail card */
  var pop = document.getElementById('pop');
  function openCard(id){
    var b = byId[id]; if (!b) return;
    var due = b.w10 <= todayUTC() && !b.hold;
    document.getElementById('p-k').textContent = b.hold ? 'On hold' : due ? 'Should be ready' : 'On the 10 week clock';
    document.getElementById('p-nm').textContent = b.name;
    var rows = [
      ['Where', b.where], ['Build', b.product], ['Deposit', fmtLong(b.dep)],
      ['Week 6 call', fmtLong(b.w6)], ['Week 9 check', fmtLong(b.w9)], ['Week 10 due', fmtLong(b.w10)],
      ["Marta's ETA", b.etaDate ? fmtLong(b.etaDate) : b.actual_eta], ['Status', b.status], ['Note', b.note]
    ];
    document.getElementById('p-dl').innerHTML = rows.filter(function(r){ return r[1]; }).map(function(r){ return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
    var a = document.getElementById('p-open');
    if (b.contact_id) { a.href = GHL_CONTACT + encodeURIComponent(b.contact_id); a.style.display = ''; } else { a.style.display = 'none'; }
    pop.classList.add('on');
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-id]');
    if (t) { openCard(t.getAttribute('data-id')); return; }
    if (e.target === pop || e.target.id === 'p-close') pop.classList.remove('on');
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') pop.classList.remove('on');
    if (e.key === 'Enter' && document.activeElement && document.activeElement.hasAttribute('data-id')) openCard(document.activeElement.getAttribute('data-id'));
  });

  renderBuilds(BUILDS_SEED, 'Loading from the sheet.');
  fetch(SHEET_URL + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data && Array.isArray(data.builds) && data.builds.length) {
        renderBuilds(data.builds, 'Live from the sheet, ' + data.builds.length + (data.builds.length === 1 ? ' build.' : ' builds.'));
      } else {
        renderBuilds(BUILDS_SEED, 'The sheet had no builds. Showing the rows built into this page.');
      }
    })
    .catch(function(){ renderBuilds(BUILDS_SEED, 'Could not reach the sheet. Showing the rows built into this page.'); });
})();
</script>
</body>
</html>
