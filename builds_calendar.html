<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#16261C;
  --forest-deep:#1F3D28;
  --forest:#2B5336;
  --sage:#50795F;
  --sage-pale:#8fae86;
  --honey:#C08B41;
  --honey-light:#D6A868;
  --tint:#dbe7dd;
  --tint-pale:#eef4ef;
  --line:#dbe7dd;
}
*{box-sizing:border-box}
html,body{margin:0;background:#ffffff;color:var(--ground);font-family:"Poppins",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{padding:16px}

/* head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--honey)}
h1{margin:2px 0 0;font-size:20px;font-weight:700;line-height:1.2;color:var(--forest-deep)}
h1 span{color:var(--honey)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:#ffffff;color:var(--forest-deep);border-radius:999px;height:32px;min-width:32px;padding:0 12px;cursor:pointer}
.nav button:hover{border-color:var(--sage-pale)}
.nav .mlab{min-width:130px;text-align:center;font-weight:700;font-size:14px;color:var(--forest-deep)}

/* layout: calendar left, next up right when there is room */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:820px){ .layout{grid-template-columns:1fr} }

/* calendar */
.cal{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#ffffff}
.dow,.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.55fr))}
.dow div{padding:8px 8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);background:var(--tint-pale);border-bottom:1px solid var(--line)}
.cell{min-height:84px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:nth-child(7n){border-right:0}
.grid .cell:nth-last-child(-n+7){border-bottom:0}
.cell.we{background:#fafcfa}
.cell.out .dn{color:#b9c9bd}
.cell.out .chip{opacity:.55}
.dn{font-size:12px;font-weight:600;color:var(--sage);line-height:1}
.cell.today{box-shadow:inset 0 0 0 2px var(--honey)}
.cell.today .dn{color:var(--honey);font-weight:700}

.chip{display:block;width:100%;text-align:left;font:inherit;font-size:11.5px;font-weight:600;line-height:1.25;padding:4px 7px;border-radius:7px;border:0;background:var(--forest-deep);color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;cursor:pointer}
.chip.due{background:var(--honey)}
.chip.hold{background:repeating-linear-gradient(135deg,var(--sage-pale) 0 4px,var(--tint) 4px 8px);color:var(--ground)}
.chip.eta{background:#ffffff;color:var(--forest-deep);box-shadow:inset 0 0 0 1.5px var(--honey)}
.chip.mk{background:var(--tint-pale);color:var(--sage);font-weight:600}
.more{font-size:11px;color:var(--sage);font-weight:600;padding-left:2px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:11.5px;color:var(--sage)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:10px;border-radius:3px}
.legend i.open{background:var(--forest-deep)}
.legend i.due{background:var(--honey)}
.legend i.hold{background:repeating-linear-gradient(135deg,var(--sage-pale) 0 3px,var(--tint) 3px 6px)}
.legend i.eta{background:#ffffff;box-shadow:inset 0 0 0 1.5px var(--honey)}
.legend i.mk{background:var(--tint-pale);box-shadow:inset 0 0 0 1px var(--line)}

/* next up */
.side{border:1px solid var(--line);border-radius:14px;padding:14px;background:#ffffff}
.side h2{margin:0 0 10px;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--honey)}
.side h2.second{margin-top:16px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list a{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;color:inherit;text-decoration:none}
.list a:hover .nm{color:var(--forest)}
.date{border-radius:8px;background:var(--tint-pale);text-align:center;padding:5px 0;line-height:1.1}
.date b{display:block;font-size:17px;font-weight:700;color:var(--forest-deep)}
.date s{display:block;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.list .due .date{background:var(--honey)}
.list .due .date b,.list .due .date s{color:#ffffff}
.nm{font-weight:700;font-size:13.5px;color:var(--ground);line-height:1.3}
.sub{font-size:12px;color:var(--sage);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{font-size:12.5px;color:var(--sage);margin:0}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--sage)}
.foot a{color:var(--sage)}

/* pop-over detail */
.pop{position:fixed;inset:0;background:rgba(22,38,28,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.pop.on{display:flex}
.card{background:#ffffff;border:1px solid var(--line);border-radius:14px;max-width:380px;width:100%;padding:16px 18px;box-shadow:0 10px 30px rgba(22,38,28,.18)}
.card .k{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--honey)}
.card h3{margin:2px 0 8px;font-size:17px;font-weight:700;color:var(--forest-deep)}
.card dl{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;margin:0 0 14px;font-size:12.5px}
.card dt{color:var(--sage);font-weight:600}
.card dd{margin:0}
.card .acts{display:flex;gap:8px;justify-content:flex-end}
.card .acts a,.card .acts button{font:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none}
.card .acts a{background:var(--honey);color:#ffffff;border:0}
.card .acts button{background:#ffffff;color:var(--forest-deep);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <div class="kicker">Builds</div>
      <h1>Who should be <span>ready</span> when</h1>
    </div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Previous month">&#8249;</button>
      <div class="mlab" id="mlab"></div>
      <button type="button" id="next" aria-label="Next month">&#8250;</button>
      <button type="button" id="now">Today</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="cal">
        <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="legend">
        <span><i class="open"></i> week 10 due</span>
        <span><i class="due"></i> week 10 passed</span>
        <span><i class="hold"></i> on hold</span>
        <span><i class="eta"></i> Marta's ETA</span>
        <span><i class="mk"></i> week 6 and 9 calls</span>
      </div>
    </div>

    <aside class="side">
      <h2>Should be ready now</h2>
      <ul class="list" id="ready"></ul>
      <h2 class="second">Next up</h2>
      <ul class="list" id="upnext"></ul>
    </aside>
  </div>

  <div class="foot">
    <span id="status">Loading from the sheet.</span>
    <span>10 week model from the deposit date · v1</span>
  </div>
</div>

<div class="pop" id="pop" role="dialog" aria-modal="true">
  <div class="card">
    <div class="k" id="p-k">Build</div>
    <h3 id="p-nm"></h3>
    <dl id="p-dl"></dl>
    <div class="acts">
      <button type="button" id="p-close">Close</button>
      <a id="p-open" href="#" target="_blank" rel="noopener">Open in GHL</a>
    </div>
  </div>
</div>

<script>

    { key: 'OOHJdw7o492Yyfsqz9Qs', name: 'Cwmdu Campsite (Sarah Farr, Calvin Clark)', where: 'Crickhowell', product: '4m mobile barrel sauna on a trailer plus two commercial ice baths', deposit_date: '2026-09-16', actual_eta: '', status: 'awaiting grant', distance: 'local', note: 'Grant decision early October, invoice unpaid', deal_id: 'OOHJdw7o492Yyfsqz9Qs', contact_id: 'pLCTIyQE9SsSkYe4GcXw' },
    { key: 'kmpkX9nn3Lqr8m8f6lDn', name: 'James McCarthy', where: 'Bartley, New Forest', product: '3.4m x 2.3m sauna with 1m changing room', deposit_date: '2026-09-17', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'kmpkX9nn3Lqr8m8f6lDn', contact_id: 'g46WL3KgIijoFXeuHpHa' },
    { key: 'HCmnW1MIhKyTLZl911NJ', name: 'Verity Johnson', where: 'Brockenhurst', product: 'Not recorded in GHL', deposit_date: '2026-09-18', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'HCmnW1MIhKyTLZl911NJ', contact_id: 'oUlaxQ5L8Q7poRZVuRYO' },
    { key: 'mwTrpXxtL5VracKVMWXq', name: 'Eleanor Matthews', where: 'Woodstock, Oxfordshire', product: 'Compact barrel sauna 1.8m x 2m, on site build, ice bath discussed', deposit_date: '2026-09-23', actual_eta: '', status: 'deposit paid', distance: 'far', note: 'Video review owed', deal_id: 'mwTrpXxtL5VracKVMWXq', contact_id: 'kPXojAbWmAJHBP3c8WAB' },
    { key: 'F6RisnNpYYma9SAbXYai', name: 'Paul Averley', where: 'Newcastle upon Tyne', product: '2.7m barrel sauna, wood burning, tint globe, flush full glass', deposit_date: '2026-09-25', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'F6RisnNpYYma9SAbXYai', contact_id: 'e3eBiic1e2VP7814sNEr' },
    { key: 'jkic6D40Dkn359bEMj4L', name: 'Christopher Longcroft', where: 'Danehill, Sussex', product: '3.2m x 2.3m barrel sauna, porch, Harvia Cilindro wifi heater', deposit_date: '2026-09-30', actual_eta: '', status: 'deposit paid', distance: 'far', note: '', deal_id: 'jkic6D40Dkn359bEMj4L', contact_id: 'AguDiMkkOPQWLnSY9j5b' }
  ];

  var DAY = 86400000;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function iso(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
  function add(d, n){ return new Date(d.getTime() + n * DAY); }
  function key(d){ return d.toISOString().slice(0, 10); }
  function fmt(d, o){ o = o || { day: 'numeric', month: 'short' }; o.timeZone = 'UTC'; return d ? d.toLocaleDateString('en-GB', o) : ''; }
  function todayUK(){
    var p = {}; new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    return new Date(Date.UTC(+p.year, +p.month - 1, +p.day));
  }

  var today = todayUK();
  var view = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
  var builds = [];
  var byId = {};

  function norm(b){
    var o = {}; Object.keys(b).forEach(function(k){ o[k] = b[k] == null ? '' : String(b[k]); });
    o.dep = iso(o.deposit_date);
    if (!o.dep) return null;
    o.w6 = add(o.dep, 42); o.w9 = add(o.dep, 63); o.w10 = add(o.dep, 70);
    o.eta = iso(o.actual_eta);
    var st = (o.status || '').toLowerCase();
    o.hold = /grant|hold|unpaid|invoice/.test(st);
    o.due = !o.hold && o.w10 <= today;
    o.id = o.key || o.deal_id || o.name;
    return o;
  }

  function load(rows){
    builds = rows.map(norm).filter(Boolean).sort(function(a, b){ return a.w10 - b.w10; });
    byId = {}; builds.forEach(function(b){ byId[b.id] = b; });
    render();
  }

  /* one map of date -> events, rebuilt on every render */
  function events(){
    var ev = {};
    function put(d, e){ var k = key(d); (ev[k] = ev[k] || []).push(e); }
    builds.forEach(function(b){
      put(b.w10, { b: b, kind: b.hold ? 'hold' : b.due ? 'due' : 'open', label: b.name });
      if (b.eta) put(b.eta, { b: b, kind: 'eta', label: 'ETA ' + b.name });
      if (!b.hold) {
        put(b.w6, { b: b, kind: 'mk', label: 'Wk 6 ' + b.name });
        put(b.w9, { b: b, kind: 'mk', label: 'Wk 9 ' + b.name });
      }
    });
    var order = { due: 0, open: 1, hold: 2, eta: 3, mk: 4 };
    Object.keys(ev).forEach(function(k){ ev[k].sort(function(a, b){ return order[a.kind] - order[b.kind]; }); });
    return ev;
  }

  function render(){
    document.getElementById('mlab').textContent = fmt(view, { month: 'long', year: 'numeric' });
    var ev = events();
    var first = view; var dow = (first.getUTCDay() + 6) % 7;
    var start = add(first, -dow);
    var nextMonth = new Date(Date.UTC(view.getUTCFullYear(), view.getUTCMonth() + 1, 1));
    var cells = Math.ceil((dow + Math.round((nextMonth - first) / DAY)) / 7) * 7;
    var h = '';
    for (var i = 0; i < cells; i++) {
      var d = add(start, i);
      var out = d.getUTCMonth() !== view.getUTCMonth();
      var we = (i % 7) > 4;
      var list = ev[key(d)] || [];
      var cls = 'cell' + (out ? ' out' : '') + (we ? ' we' : '') + (key(d) === key(today) ? ' today' : '');
      h += '<div class="' + cls + '"><div class="dn">' + d.getUTCDate() + '</div>';
      var cap = we ? 2 : 3;
      list.slice(0, cap).forEach(function(e){
        h += '<button type="button" class="chip ' + e.kind + '" data-id="' + esc(e.b.id) + '" title="' + esc(e.label) + '">' + esc(e.label) + '</button>';
      });
      if (list.length > cap) h += '<span class="more">+' + (list.length - cap) + ' more</span>';
      h += '</div>';
    }
    document.getElementById('grid').innerHTML = h;

    var ready = builds.filter(function(b){ return b.due; });
    var up = builds.filter(function(b){ return !b.hold && b.w10 > today; }).slice(0, 6);
    document.getElementById('ready').innerHTML = ready.length ? ready.map(row).join('') : '<li><p class="empty">Nothing past week 10.</p></li>';
    document.getElementById('upnext').innerHTML = up.length ? up.map(row).join('') : '<li><p class="empty">Nothing coming up.</p></li>';
  }

  function row(b){
    var d = b.eta || b.w10;
    var sub = b.eta ? 'ETA from Marta' : (b.where || b.product);
    return '<li class="' + (b.due ? 'due' : '') + '"><a href="#" data-id="' + esc(b.id) + '"><span class="date"><b>' + d.getUTCDate() + '</b><s>' + esc(fmt(d, { month: 'short' })) + '</s></span><span><span class="nm">' + esc(b.name) + '</span><span class="sub">' + esc(sub) + '</span></span></a></li>';
  }

  /* detail card */
  var pop = document.getElementById('pop');
  function open(id){
    var b = byId[id]; if (!b) return;
    document.getElementById('p-k').textContent = b.hold ? 'On hold' : b.due ? 'Should be ready' : 'On the 10 week clock';
    document.getElementById('p-nm').textContent = b.name;
    var rows = [
      ['Where', b.where], ['Build', b.product], ['Deposit', fmt(b.dep, { weekday: 'short', day: 'numeric', month: 'short' })],
      ['Week 6 call', fmt(b.w6)], ['Week 9 check', fmt(b.w9)], ['Week 10 due', fmt(b.w10)],
      ["Marta's ETA", b.eta ? fmt(b.eta, { weekday: 'short', day: 'numeric', month: 'short' }) : b.actual_eta],
      ['Status', b.status], ['Note', b.note]
    ];
    document.getElementById('p-dl').innerHTML = rows.filter(function(r){ return r[1]; }).map(function(r){ return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
    var a = document.getElementById('p-open');
    if (b.contact_id) { a.href = GHL_CONTACT + encodeURIComponent(b.contact_id); a.style.display = ''; } else { a.style.display = 'none'; }
    pop.classList.add('on');
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-id]');
    if (t) { e.preventDefault(); open(t.getAttribute('data-id')); return; }
    if (e.target === pop || e.target.id === 'p-close') pop.classList.remove('on');
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') pop.classList.remove('on'); });

  document.getElementById('prev').onclick = function(){ view = new Date(Date.UTC(view.getUTCFullYear(), view.getUTCMonth() - 1, 1)); render(); };
  document.getElementById('next').onclick = function(){ view = new Date(Date.UTC(view.getUTCFullYear(), view.getUTCMonth() + 1, 1)); render(); };
  document.getElementById('now').onclick = function(){ view = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1)); render(); };

  var st = document.getElementById('status');
  load(BUILDS_SEED);
  fetch(SHEET_URL + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data && Array.isArray(data.builds) && data.builds.length) {
        load(data.builds);
        st.textContent = 'Live from the sheet, ' + data.builds.length + ' builds. Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }) + ' UK.';
      } else {
        st.textContent = 'Sheet had no builds. Showing the rows built into this page.';
      }
    })
    .catch(function(){ st.textContent = 'Could not reach the sheet. Showing the rows built into this page.'; });
})();
</script>
</body>
</html>
