<script>
  var src = document.getElementById('emailsrc').textContent.replace(/^\s+/, '');
  var frame = document.getElementById('frame');
  var code = document.getElementById('code');
  frame.srcdoc = src;
  code.textContent = src;
  function on(a, b) { a.classList.add('on'); b.classList.remove('on'); }
  document.getElementById('bPrev').onclick = function () { on(this, document.getElementById('bCode')); frame.parentNode.style.display = 'flex'; code.style.display = 'none'; };
  document.getElementById('bCode').onclick = function () { on(this, document.getElementById('bPrev')); frame.parentNode.style.display = 'none'; code.style.display = 'block'; };
  document.getElementById('bDesk').onclick = function () { on(this, document.getElementById('bPhone')); frame.classList.remove('phone'); };
  document.getElementById('bPhone').onclick = function () { on(this, document.getElementById('bDesk')); frame.classList.add('phone'); };
  document.getElementById('bCopy').onclick = function () {
    var b = this;
    try { navigator.clipboard.writeText(src).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy for GHL'; }, 1500); }); }
    catch (e) { b.textContent = 'Use Code view'; }
  };
</script>
